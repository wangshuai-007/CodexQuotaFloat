# Verify commands for HelloAGENTS qa-review
# One command per line.

commands:
  - dotnet build "src/QuotaFloat/QuotaFloat.csproj" -c Release
  - dotnet run --project "tests/QuotaFloat.Tests/QuotaFloat.Tests.csproj" -c Release
  - dotnet publish "src/QuotaFloat/QuotaFloat.csproj" -c Release --self-contained false -o "dist"
  - dotnet "dist/CodexQuotaFloat.dll" --render-preview "artifacts"
  - Start-Process -FilePath "dist/CodexQuotaFloat.exe" -ArgumentList '--smoke-test "artifacts/native-final"' -WindowStyle Hidden -Wait
